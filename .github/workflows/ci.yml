name: CI
on:
  push:
    branches: [main, v1]
    tags: ['v[0-9]*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Pinned Rust toolchain, installed by scripts/setup-rust.sh with the rustup that
  # ships on the runner image. Bump when the daemon needs a newer compiler.
  RUST_TOOLCHAIN: '1.94.0'

# Actions are pinned to full commit SHAs; the comment names the version.
# Xcode is pinned to 26.6 on the macos-26 image (the same Xcode used locally),
# per actions/runner-images macos-26-arm64 Readme, image 20260907. Bump both together.
# UI tests (AppUITests) are not run here: they need a logged-in GUI session and
# accessibility permission that hosted runners don't grant reliably. Run locally.
# Coverage: the kit job gates FSearchKit at 95%; the app job gates AppTests-only coverage at 95%.
jobs:
  kit:
    strategy:
      matrix:
        include:
          - os: macos-26
            xcode: '26.6'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - run: scripts/setup-rust.sh
      - run: scripts/build-daemon.sh --host-only
      - run: swift build --build-tests -Xswiftc -warnings-as-errors
        working-directory: Packages/FSearchKit
      - run: swift build --product FSearchBench -Xswiftc -warnings-as-errors
        working-directory: Packages/FSearchKit
      - name: FSearchKit tests and coverage gate (95%)
        run: scripts/coverage.sh --kit-only --min 95

  app:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: scripts/setup-rust.sh
      - run: scripts/install-xcodegen.sh
      - run: scripts/build-daemon.sh
      - run: scripts/generate-project.sh
      - run: >
          xcodebuild -project FSearch.xcodeproj -scheme FSearch -configuration Debug
          -onlyUsePackageVersionsFromResolvedFile -derivedDataPath build -destination 'generic/platform=macOS'
          CODE_SIGN_IDENTITY=- build
      - name: App unit tests and coverage gate
        # Hosted unit tests (AppTests) run headless on the runner; the UI tests do not.
        # The floor is 95% (ADR 0012); the local end-to-end run (`make coverage`) combines both suites.
        env:
          # xcodebuild hands TEST_RUNNER_* to the test host without the prefix:
          # the menu-bar safety test records, not fails, a status window left up here.
          TEST_RUNNER_FSEARCH_CI: '1'
        run: scripts/coverage.sh --unit-only --min 95

  lint:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: scripts/gen-credits.sh --check
      - name: Check Markdown links
        run: scripts/check-links.sh
      - name: Syntax-check shell scripts
        run: for f in scripts/*.sh scripts/hooks/*; do bash -n "$f"; done
      - name: Install actionlint and shellcheck (pinned, checksum-verified)
        env:
          ACTIONLINT: '1.7.12'
          ACTIONLINT_SHA256: aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f
          SHELLCHECK: '0.11.0'
          SHELLCHECK_SHA256: 339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/lint-bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          a="actionlint_${ACTIONLINT}_darwin_arm64.tar.gz"
          curl -fsSLo "$a" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT}/$a"
          echo "$ACTIONLINT_SHA256  $a" | shasum -a 256 -c -
          tar -xzf "$a" -C "$bin" actionlint
          s="shellcheck-v${SHELLCHECK}.darwin.aarch64.tar.gz"
          curl -fsSLo "$s" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK}/$s"
          echo "$SHELLCHECK_SHA256  $s" | shasum -a 256 -c -
          tar -xzf "$s" --strip-components 1 -C "$bin" "shellcheck-v${SHELLCHECK}/shellcheck"
          echo "$bin" >> "$GITHUB_PATH"
      - run: actionlint
      - run: shellcheck -S warning scripts/*.sh scripts/hooks/*
      - name: swift format lint
        run: xcrun swift format lint --strict --configuration .swift-format -r App AppTests AppUITests Packages/FSearchKit/Sources Packages/FSearchKit/Tests

  release:
    # Only on version tags, and only for commits on main. Secrets are referenced by
    # name; none live in the repo. The `release` environment (created in the repo
    # settings) gates the signing secrets; a tag ruleset limits who can push v* tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [kit, app, lint]
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    env:
      # release.sh resolves and archives in this derived-data folder; the steps below
      # resolve into it before the keychain exists.
      RELEASE_DERIVED_DATA: build/release-derived
    concurrency:
      group: release
      cancel-in-progress: false
    # Scoped to this job: draft release, build provenance attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release.sh numbers the build from the full history (git rev-list --count) and
          # checks it against the previous v[0-9]* tag's; the next step needs origin/main.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; releases are tagged on main only"
            exit 1
          fi
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: scripts/setup-rust.sh
      - run: scripts/install-xcodegen.sh
      # Build the daemon before the signing keychain exists: its third-party crates'
      # build scripts must never run while codesign access to the Developer ID key is unlocked.
      - run: scripts/build-daemon.sh
      # Likewise generate the project, resolve the Swift packages (only the versions in the
      # committed Package.resolved) and archive the app before the keychain exists. After
      # it, release.sh --sign only signs, notarizes and packages: nothing is fetched or built.
      - run: scripts/generate-project.sh
      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies -project FSearch.xcodeproj -scheme FSearch
          -derivedDataPath "$RELEASE_DERIVED_DATA" -onlyUsePackageVersionsFromResolvedFile
      - name: Build the release archive (unsigned)
        env:
          FSEARCH_PREBUILT: '1'
          FSEARCH_PROJECT_READY: '1'
        run: scripts/release.sh --prepare "${GITHUB_REF_NAME#v}"
      # SBOM of the daemon's crates (CycloneDX), generated before the keychain exists for the
      # same reason as the build above. cargo-cyclonedx only reads `cargo metadata`; it runs
      # no build scripts. Swift packages (KeyboardShortcuts, Sparkle) are not in this SBOM:
      # no pinned, checksum-verified tool reads Package.resolved into CycloneDX; they are
      # listed in THIRD_PARTY_NOTICES.md and scanned by deps.yml.
      - name: Generate the daemon SBOM (CycloneDX)
        env:
          CARGO_CYCLONEDX: '0.5.10'
          CARGO_CYCLONEDX_SHA256: 4c39e13494d51c9d7f63e2923e7afdb5648a7a806a9ed7684dbe3786d2e2d1da
        run: |
          set -euo pipefail
          rev=$(grep -m1 '^REV=' scripts/build-daemon.sh | grep -o '[0-9a-f]\{40\}' || true)
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not read REV from scripts/build-daemon.sh"; exit 1; }
          [ "$(cat Vendor/fsearch.rev)" = "$rev" ] || { echo "::error::Vendor/fsearch.rev is not the pinned $rev"; exit 1; }
          cd "$RUNNER_TEMP"
          t="cargo-cyclonedx-aarch64-apple-darwin.tar.xz"
          curl -fsSLo "$t" "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CARGO_CYCLONEDX}/$t"
          echo "$CARGO_CYCLONEDX_SHA256  $t" | shasum -a 256 -c -
          mkdir sbom-tool && tar -xJf "$t" --strip-components 1 -C sbom-tool cargo-cyclonedx-aarch64-apple-darwin/cargo-cyclonedx
          git init -q sbom-src
          git -C sbom-src fetch -q --depth 1 https://github.com/domfahey/fsearch.git "$rev"
          git -C sbom-src checkout -q FETCH_HEAD
          [ "$(git -C sbom-src rev-parse HEAD)" = "$rev" ] || { echo "::error::fetched commit is not $rev"; exit 1; }
          sbom-tool/cargo-cyclonedx cyclonedx --manifest-path sbom-src/Cargo.toml --format json --target all \
            --override-filename fsearch-daemon.cdx
          cd "$GITHUB_WORKSPACE"
          mkdir -p build/sbom
          mv "$RUNNER_TEMP/sbom-src/fsearch-daemon.cdx.json" "build/sbom/fsearch-daemon-${GITHUB_REF_NAME}.cdx.json"
      # Signing steps. They share a guard against a tampered environment: each uses a fixed
      # shell and absolute tool paths, and resets PATH and clears DYLD_* itself (GITHUB_PATH
      # and GITHUB_ENV, writable by earlier steps, otherwise prepend to PATH or inject
      # variables). The guard fails the job if an earlier step altered the environment.
      # Residual risk: everything before this point ran in the same job and on the same
      # runner as the keys, so code from the build can still tamper with files or leave a
      # background process behind. Splitting build and sign into two jobs would remove that.
      - name: Check the environment before the keychain is unlocked
        shell: /usr/bin/env -u BASH_ENV /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          bad=0
          while IFS='=' read -r name _; do
            case "$name" in
              DYLD_*|LD_*|BASH_ENV|ENV|BASH_FUNC_*|CDPATH|GIT_EXEC_PATH|GIT_CONFIG*|SSH_ASKPASS|DEVELOPER_DIR|TOOLCHAINS)
                echo "::error::$name is set; an earlier step altered the environment"; bad=1 ;;
            esac
          done < <(/usr/bin/env)
          # The signing steps reset PATH to /usr/bin:/bin:/usr/sbin:/sbin, so the system
          # copies of their tools are what run. The runner's own PATH (Homebrew first) is
          # not checked: a Homebrew shasum there is never called.
          for t in xcrun security ditto shasum codesign hdiutil base64; do
            [ -x "/usr/bin/$t" ] || { echo "::error::/usr/bin/$t is missing"; bad=1; }
          done
          [ "$bad" -eq 0 ]
      - name: Import signing certificate
        shell: /usr/bin/env -u BASH_ENV /bin/bash --noprofile --norc -eo pipefail {0}
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          umask 077
          trap '/bin/rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          echo "$CERT_P12_BASE64" | /usr/bin/base64 --decode > "$RUNNER_TEMP/cert.p12"
          /usr/bin/security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          /usr/bin/security set-keychain-settings -lut 21600 "$KEYCHAIN"
          /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          /usr/bin/security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          /bin/rm -f "$RUNNER_TEMP/cert.p12"
          /usr/bin/security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Add to the user search list (keeping the existing ones) and make it default.
          EXISTING=()
          while IFS= read -r kc; do [ -n "$kc" ] && EXISTING+=("$kc"); done < <(/usr/bin/security list-keychains -d user | /usr/bin/sed 's/^[[:space:]]*"//; s/"$//')
          /usr/bin/security list-keychains -d user -s "$KEYCHAIN" ${EXISTING[@]+"${EXISTING[@]}"}
          /usr/bin/security default-keychain -d user -s "$KEYCHAIN"
      - name: Store notary credentials (App Store Connect API key)
        shell: /usr/bin/env -u BASH_ENV /bin/bash --noprofile --norc -eo pipefail {0}
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          umask 077
          KEYFILE="$RUNNER_TEMP/notary-key.p8"
          trap '/bin/rm -f "$KEYFILE"' EXIT
          echo "$NOTARY_KEY_P8_BASE64" | /usr/bin/base64 --decode > "$KEYFILE"
          /usr/bin/xcrun notarytool store-credentials fsearch-notary \
            --key "$KEYFILE" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN"
      - name: Sign, notarize, package
        shell: /usr/bin/env -u BASH_ENV /bin/bash --noprofile --norc -eo pipefail {0}
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        # Signs the archive built above, before the keychain existed; builds nothing.
        # release.sh --sign calls only system tools (codesign, xcrun, ditto, hdiutil, shasum,
        # spctl, PlistBuddy, file, find), so the reset PATH is enough for it.
        run: |
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          scripts/release.sh --sign "${GITHUB_REF_NAME#v}"
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release/*.dmg
      - name: Attest the daemon SBOM
        id: attest-sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: build/release/*.dmg
          sbom-path: build/sbom/fsearch-daemon-${{ github.ref_name }}.cdx.json
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          SBOM_ATTESTATION_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          DMG=$(ls build/release/*.dmg)
          SBOM="build/sbom/fsearch-daemon-${GITHUB_REF_NAME}.cdx.json"
          cp "$ATTESTATION_BUNDLE" "$DMG.intoto.jsonl"
          cp "$SBOM_ATTESTATION_BUNDLE" "$SBOM.intoto.jsonl"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "FSearch ${GITHUB_REF_NAME#v}" \
            --notes "Draft. Verify the download with the instructions in .github/SECURITY.md." \
            "$DMG" "$DMG.sha256" "$DMG.intoto.jsonl" "$SBOM" "$SBOM.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FSearch-dmg
          path: |
            build/release/*.dmg
            build/release/*.sha256
            build/release/*.intoto.jsonl
            build/sbom/*
      - name: Delete signing keychain
        if: always()
        shell: /usr/bin/env -u BASH_ENV /bin/bash --noprofile --norc -eo pipefail {0}
        run: /usr/bin/security delete-keychain "$KEYCHAIN" || true

  bench:
    # Performance regression check (bench/README.md). Compares against the
    # "ci-macos-26" baseline entry in bench/baseline.json and uploads the results
    # JSON. Exit 75 means the hosted runner stayed busy or slow (logged as a
    # warning); exit 1 means a metric regressed twice on a quiet canary and fails
    # this job.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BENCH_MACHINE: ci-macos-26
      # Seconds each daemon request may take (local default 15 or 30). Hosted runners stall.
      FSEARCH_BENCH_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: scripts/setup-rust.sh
      - run: scripts/build-daemon.sh --host-only
      - name: Run benchmarks and compare against ci-macos-26 baseline
        run: |
          rc=0
          scripts/bench.sh || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "::warning::Benchmarks inconclusive (hosted runner busy or slow); not failing CI"
            exit 0
          fi
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: bench/results/*.json
          if-no-files-found: warn
