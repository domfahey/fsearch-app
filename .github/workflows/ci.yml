name: CI
on:
  push:
    branches: [main, v1]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs; the comment names the version.
# Xcode is pinned to 26.6 on the macos-26 image (the same Xcode used locally),
# per actions/runner-images macos-26-arm64 Readme, image 20260907. Bump both together.
# UI tests (AppUITests) are not run here: they need a logged-in GUI session and
# accessibility permission that hosted runners don't grant reliably. Run locally.
jobs:
  kit:
    # macos-14 is the deployment target (macOS 14): its newest Xcode with Swift 6 is
    # 16.2 (Swift 6.0.3, satisfies swift-tools-version 6.0), per macos-14-arm64 Readme,
    # image 20260831. That image is deprecated (unsupported 2026-11-02); then drop the leg.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            xcode: '26.6'
          - os: macos-14
            xcode: '16.2'
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12 (merge of #185)
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: scripts/build-daemon.sh
      - run: swift test
        working-directory: Packages/FSearchKit

  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12 (merge of #185)
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: brew install xcodegen
      - run: scripts/build-daemon.sh
      - run: xcodegen generate
      - run: >
          xcodebuild -project FSearch.xcodeproj -scheme FSearch -configuration Debug
          -derivedDataPath build -destination 'generic/platform=macOS'
          CODE_SIGN_IDENTITY=- build

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: scripts/gen-credits.sh --check
      - name: Syntax-check shell scripts
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - run: brew install actionlint shellcheck
      - run: actionlint
      - run: shellcheck -S warning scripts/*.sh
      - name: swift format lint
        # Remove continue-on-error once the codebase has been formatted.
        continue-on-error: true
        run: xcrun swift format lint --strict --configuration .swift-format -r App AppUITests Packages/FSearchKit/Sources Packages/FSearchKit/Tests

  release:
    # Only on version tags. Secrets are referenced by name; none live in the repo.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [kit, app]
    runs-on: macos-26
    env:
      DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12 (merge of #185)
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: brew install xcodegen
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          umask 077
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Add to the user search list (keeping the existing ones) and make it default.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN"
      - name: Store notary credentials (App Store Connect API key)
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          umask 077
          KEYFILE="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$KEYFILE"' EXIT
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEYFILE"
          xcrun notarytool store-credentials fsearch-notary \
            --key "$KEYFILE" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN"
      - run: scripts/release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FSearch-dmg
          path: build/release/*.dmg
      - name: Delete signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

  bench:
    # Non-blocking performance report (bench/README.md). Compares against a
    # "ci-macos-26" baseline entry if one exists, never fails the workflow, and
    # uploads the results JSON. Hosted-runner timings are noisy; read trends, not single runs.
    runs-on: macos-26
    continue-on-error: true
    env:
      BENCH_MACHINE: ci-macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12 (merge of #185)
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: scripts/build-daemon.sh
      - run: scripts/bench.sh --report-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-results
          path: bench/results/*.json
          if-no-files-found: warn
